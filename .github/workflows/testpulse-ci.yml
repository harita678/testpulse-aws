# TestPulse CI — runs pytest for all three services (ingestor, processor, dashboard)
# on every push and PR to main.
#
# Uses a matrix to test each service in its own parallel job on a clean Ubuntu VM
# with Python 3.12 — the same version as the EC2 and Lambda, so version-specific
# bugs get caught here before merge.

name: TestPulse CI

on:
  push:
    branches: [main]
    paths:
      - 'ingestor/**'
      - 'processor/**'
      - 'dashboard/**'
      - '.github/workflows/testpulse-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ingestor/**'
      - 'processor/**'
      - 'dashboard/**'
      - '.github/workflows/testpulse-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [ingestor, processor, dashboard]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: pytest -v